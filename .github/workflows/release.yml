name: Release

on:
  # workflow_dispatch is how a tag whose publish failed gets re-run after a fix:
  # a tag push executes the workflow file AT THE TAGGED COMMIT, so a fix committed
  # after the tag would never run under that tag. Dispatching on the branch runs
  # this file and checks out the fixed tree.
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No `registry-url` on purpose: it writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a local
          # .npmrc, and with the secret retired that line is an EMPTY bearer token -
          # the registry then answers 404 on PUT instead of letting npm perform the
          # OIDC trusted-publishing exchange.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Gate
        shell: pwsh
        run: ./scripts/verify-kit.ps1

      - name: Assert the tag matches package.json
        run: |
          # Without this, the two halves of a release can disagree and the run is
          # still green. The changelog gate below keys off the TAG while the guard
          # and the publish key off package.json, so `v0.3.30` on a tree whose
          # package.json still says 0.3.29 used to pass the changelog check, skip
          # the publish ("0.3.29 is already published"), and open a GitHub Release
          # page for a version npm never received - on an immutable tag, so it
          # cannot be corrected in place.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PKG_VERSION="$(node -p "require('./package.json').version")"
            echo "tag=${TAG_VERSION} package.json=${PKG_VERSION}"
            if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
              exit 1
            fi
          else
            echo "not a tag push; skipping the tag/package.json assertion"
          fi

      - name: Verify the changelog names this version
        run: |
          # A tag push names the version in the ref; a workflow_dispatch run on a
          # branch does not, so fall back to package.json there.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          grep -q "## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [${VERSION}]' section"; exit 1; }

      # Trusted publishing: the OIDC token (id-token: write above) replaces the
      # long-lived NPM_TOKEN, so this step reads no secret. The previous version
      # also skipped the publish when NPM_TOKEN was empty - that guard is gone on
      # purpose, or retiring the secret would have turned this into a silent no-op.
      - name: Upgrade npm and show what the publish will authenticate with
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi

      - name: Publish to npm
        id: publish
        env:
          # npm's OIDC exchange never throws: a failure is only visible at verbose
          # level, otherwise the step just fails with ENEEDAUTH and no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-plugin-guide@${version}" version >/dev/null 2>&1; then
            echo "dsh-plugin-guide@${version} is already published; skipping npm publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --provenance --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # The registry answers the publish with `PUT -> 202 Accepted` ("your package
      # is being processed"), so a green publish step does NOT mean the version is
      # served. On the 0.3.29 release the step finished at 13:20:11Z while the
      # packument was not readable until 13:22:01Z - a 110-second window in which
      # the GitHub Release already existed and the package did not. A maintainer
      # had no way to tell the difference from CI.
      - name: Verify the version is actually served by the registry
        if: steps.publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_git_head="$(git rev-parse HEAD)"
          url="https://registry.npmjs.org/dsh-plugin-guide/${version}"

          # Poll rather than sleep-and-hope: the registry accept is asynchronous.
          served=false
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$url" -o manifest.json; then served=true; break; fi
            echo "  not served yet (attempt ${i}/40); sleeping 10s"
            sleep 10
          done
          if [ "$served" != "true" ]; then
            echo "::error::dsh-plugin-guide@${version} was accepted by npm but is not served after ~400s"
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const problems = [];
            if (m.version !== process.env.VERSION) problems.push(`version ${m.version} != ${process.env.VERSION}`);
            if (m.gitHead !== process.env.EXPECTED_GIT_HEAD) problems.push(`gitHead ${m.gitHead} != tag commit ${process.env.EXPECTED_GIT_HEAD}`);
            const att = m.dist && m.dist.attestations;
            if (!att || !att.provenance) problems.push("no SLSA provenance attestation on the served manifest");
            if (problems.length) { console.error("::error::" + problems.join("; ")); process.exit(1); }
            console.log(`served: ${m.name}@${m.version}`);
            console.log(`gitHead: ${m.gitHead}`);
            console.log(`provenance: ${att.provenance.predicateType}`);
            console.log(`files: ${m.dist.fileCount}, unpacked: ${m.dist.unpackedSize} bytes`);
          '
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          EXPECTED_GIT_HEAD: ${{ github.sha }}

      - name: Confirm dist-tags.latest advanced
        if: steps.publish.outputs.published == 'true' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          curl -fsS --max-time 20 https://registry.npmjs.org/-/package/dsh-plugin-guide/dist-tags -o dist-tags.json
          latest="$(node -p "require('./dist-tags.json').latest")"
          echo "dist-tags.latest = ${latest} (expected ${version})"
          if [ "${latest}" != "${version}" ]; then
            echo "::error::dist-tags.latest is ${latest}, not ${version} - the publish did not take the latest tag"
            exit 1
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push releases the pushed tag; a workflow_dispatch run on a branch
          # releases the version in package.json (that tag already exists).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REF_NAME="${GITHUB_REF_NAME}"
          else
            REF_NAME="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "${REF_NAME}" >/dev/null 2>&1; then
            echo "release ${REF_NAME} already exists; skipping"
            exit 0
          fi
          gh release create "${REF_NAME}" --generate-notes
