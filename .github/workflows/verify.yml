name: verify-kit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:ci

      - name: Test
        run: pnpm test

      - name: Removed session-API grep (zero hits in src/)
        shell: pwsh
        run: |
          $hits = Select-String -Path (Join-Path 'src' '*') -Pattern 'snapshotEvents','eventAt\(','ownEvents\(' -Recurse
          if ($hits) { $hits | ForEach-Object { Write-Error "removed session API referenced: $($_.Path):$($_.LineNumber)" }; exit 1 }
          Write-Output 'zero hits: snapshotEvents/eventAt(/ownEvents('

      - name: Build
        run: pnpm run build

      - name: Artifact gate (dogfood self-check + scaffold smoke)
        run: pnpm run verify:artifacts

      - name: Run integrity checker (critical paths + relative link scan)
        shell: pwsh
        run: ./scripts/verify-kit.ps1
