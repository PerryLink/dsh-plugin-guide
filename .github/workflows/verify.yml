name: verify-kit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck:ci

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Artifact gate (dogfood self-check + scaffold smoke)
        run: pnpm run verify:artifacts

      - name: Run integrity checker (critical paths + relative link scan)
        shell: pwsh
        run: ./scripts/verify-kit.ps1
