# Single-package workspace root. Isolates this plugin repo from the parent
# deepseek-harness workspace checkout so `pnpm install` resolves only this
# package's own dependencies and generates a self-contained lockfile.
packages:
  - .

# The optional `@deepseek-ai/dsh` peer is metadata-only (the bundle imports no
# harness code), so do not auto-install it here; the compat smoke installs the
# exact pinned version into a scratch profile instead.
autoInstallPeers: false

# esbuild's postinstall only downloads a fallback binary (vitest's bundler); the
# platform binary ships as an optional dependency. Allow it explicitly so install
# stays green.
allowBuilds:
  esbuild: true

verifyDepsBeforeRun: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.5'
  - '@deepseek-ai/dsh-attachment@0.1.2-rc.1'
# The exact alpha/rc pins are published inside the 24h minimum-release-age
# window by design (every batch pins the newest published line); this
# zero-age override keeps fresh installs deterministic when pnpm's lockfile
# policy re-checks entries the exclusion list above cannot enumerate.
minimumReleaseAge: 0
